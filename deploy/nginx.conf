# Reverse proxy in front of the Next.js server on :3000.
# HTTPS is terminated by Cloudflare (SSL mode "Full").

# Keep Cloudflare's original scheme so next-auth builds https:// callback URLs
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 12m;   # matches serverActions bodySizeLimit (10mb)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets never change — serve straight from disk, skip Node
    location /_next/static/ {
        alias /var/www/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
